<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contábil Service Assessoria — Contabilidade em Morada de Laranjeiras, Serra | Prévia de site</title>
<meta name="description" content="Prévia de site para a Contábil Service Assessoria, escritório de contabilidade em Morada de Laranjeiras, Serra (ES).">
<meta property="og:title" content="Contábil Service Assessoria — Contabilidade que organiza hoje e protege o amanhã">
<meta property="og:description" content="Prévia de site criada para a Contábil Service Assessoria, Serra (ES).">
<meta property="og:image" content="img/cont-5.jpg">
<meta name="theme-color" content="#0c1a30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/kit.css">
<style>
:root{--bg:#f4efe6;--fg:#0c1a30;--accent:#0b6b52;--on-accent:#ffffff;
--navy:#0c1a30;--navy2:#13294b;--navy3:#08121f;--sand:#f4efe6;--sand2:#e9e0cf;--mint:#6fe0b8;--line:rgba(12,26,48,.16);
--intro-bg:#0c1a30;--intro-fg:#f4efe6;--intro-ls:.01em;
--font-display:'Instrument Serif',Georgia,'Times New Roman',serif;--font-body:'IBM Plex Sans',system-ui,sans-serif}
.lp-intro{--accent:var(--mint)}
.wrap{width:min(1200px,calc(100% - 40px));margin-inline:auto}
section{position:relative}
.pad{padding:clamp(4.5rem,10vw,8rem) 0}
.dk{background:var(--navy);color:var(--sand);--accent:var(--mint);--on-accent:#06251c}
.lp-btn{border-radius:3px;font-weight:600;font-size:.95rem;letter-spacing:.01em;min-height:48px}
em{font-style:italic}
h1,h2,h3{font-family:var(--font-display);font-weight:400}
h2{font-size:clamp(2.3rem,5.4vw,4.4rem);line-height:1.02;letter-spacing:-.012em}
h2 em{color:var(--accent)}
.dk h2 em{color:var(--mint)}
.eb{display:flex;align-items:center;gap:.8rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:.74rem;color:var(--accent);margin-bottom:1.2rem}
.eb::before{content:"";width:34px;height:1px;background:currentColor}
.dk .eb{color:var(--mint)}
.lead{line-height:1.7;font-size:1.06rem;max-width:52ch;color:rgba(12,26,48,.78)}
.dk .lead{color:rgba(244,239,230,.8)}
/* frames com zoom */
.fr{position:relative;overflow:hidden;background:var(--navy2)}
.fr .zi{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.fr:hover .zi{transform:scale(1.06)}
.fr img{object-fit:cover}
/* nav */
.nav{position:fixed;inset:0 0 auto 0;z-index:800;padding:1rem 0;transition:background .35s,padding .35s,box-shadow .35s;color:var(--sand);--accent:var(--mint);--on-accent:#06251c}
.nav.scrolled{background:rgba(244,239,230,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--navy);padding:.6rem 0;box-shadow:0 1px 0 var(--line);--accent:#0b6b52;--on-accent:#fff}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.logo{display:flex;align-items:center;gap:.65rem;font-family:var(--font-display);font-size:1.45rem;line-height:1;white-space:nowrap}
.logo b{width:36px;height:36px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;font-weight:400;font-size:1.05rem;flex:none}
.nav ul{display:flex;gap:2rem;font-weight:500;font-size:.9rem}
.nav ul a{opacity:.82;transition:opacity .3s,color .3s;padding:.4rem 0;border-bottom:1px solid transparent}
.nav ul a:hover{opacity:1;border-color:currentColor}
.nav .lp-btn{padding:.7rem 1.15rem;font-size:.88rem}
@media(max-width:900px){.nav ul{display:none}}
@media(max-width:380px){.logo{font-size:1.2rem}.logo b{width:30px;height:30px;font-size:.9rem}.nav .lp-btn{padding:.65rem .85rem;font-size:.82rem}}
/* hero */
.hero{min-height:100svh;display:flex;align-items:center;padding:clamp(6.5rem,13vh,8.5rem) 0 clamp(3.5rem,7vw,5.5rem);overflow:hidden;--mx:72%;--my:28%}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px circle at var(--mx) var(--my),rgba(111,224,184,.15),transparent 62%),linear-gradient(rgba(244,239,230,.045) 1px,transparent 1px) 0 0/100% 72px}
.hero-grid{position:relative;display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(2rem,5vw,5rem);align-items:center}
.hero h1{font-size:clamp(2.7rem,6.6vw,5.8rem);line-height:1.02;letter-spacing:-.015em}
.hero h1 em{color:var(--mint)}
.hero .sub{margin-top:1.6rem;max-width:50ch;line-height:1.7;font-size:1.08rem;color:rgba(244,239,230,.82)}
.ticks{margin-top:1.6rem;display:grid;gap:.7rem}
.ticks li{display:flex;gap:.75rem;align-items:center;font-weight:500;font-size:.98rem}
.ticks i{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(111,224,184,.16);color:var(--mint);display:grid;place-items:center}
.cta-row{display:flex;flex-wrap:wrap;gap:.9rem;align-items:center;margin-top:2.2rem}
.tel{display:inline-flex;align-items:center;gap:.6rem;min-height:48px;padding:.8rem 1.2rem;border:1px solid rgba(244,239,230,.4);border-radius:3px;font-weight:600;transition:background .3s,border-color .3s,transform .3s}
.tel:hover{background:rgba(244,239,230,.1);border-color:var(--sand);transform:translateY(-2px)}
.hero-vis{position:relative}
.hero-vis::before{content:"";position:absolute;inset:1.1rem -.8rem -1.1rem .8rem;border:1px solid rgba(111,224,184,.5);z-index:0}
.hero-vis .fr{aspect-ratio:4/5;z-index:1;max-height:72vh;width:100%}
.hero-vis .fr img{position:absolute;inset:0;width:100%;height:100%;object-position:48% 50%}
.hero-vis .fr::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(12,26,48,.5),transparent 45%)}
.float{position:absolute;z-index:2;left:-1.4rem;bottom:2rem;background:var(--sand);color:var(--navy);padding:1rem 1.2rem;box-shadow:0 24px 50px -18px rgba(0,0,0,.6);max-width:250px}
.float small{display:block;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:.66rem;color:#0b6b52;margin-bottom:.35rem}
.float span{font-family:var(--font-display);font-size:1.4rem;line-height:1.1;display:block}
@media(max-width:900px){.hero{min-height:0}.hero-grid{grid-template-columns:1fr}.hero-vis .fr{aspect-ratio:4/3;max-height:none}.float{left:.7rem;bottom:.9rem}.hero-vis::before{inset:.8rem -.5rem -.8rem .5rem}}
/* faixa */
.mq{background:var(--sand2);color:var(--navy);font-family:var(--font-display);font-style:italic;font-size:clamp(1.5rem,3vw,2.3rem);padding:.9rem 0;border-block:1px solid var(--line)}
/* serviços */
.sv{display:grid;grid-template-columns:5fr 7fr;gap:clamp(2rem,6vw,6rem);align-items:start}
.sv-l{position:sticky;top:6rem}
.sv-l .fr{aspect-ratio:4/5;margin-top:2rem}
.sv-l .fr img{position:absolute;inset:0;width:100%;height:100%;object-position:30% 50%}
.sv-l .lead{margin-top:1.2rem}
.svc{border-top:1px solid var(--line)}
.svc:last-child{border-bottom:1px solid var(--line)}
.svc a{display:grid;grid-template-columns:3rem 1fr 2.8rem;gap:1rem;align-items:start;padding:1.6rem .5rem;transition:background .35s,padding .35s}
.svc a:hover{background:rgba(11,107,82,.07);padding-left:1.1rem}
.svc .n{font-family:var(--font-display);font-style:italic;font-size:1.3rem;color:var(--accent);padding-top:.25rem}
.svc h3{font-size:clamp(1.5rem,2.6vw,2.05rem);line-height:1.1}
.svc p{margin-top:.5rem;line-height:1.6;color:rgba(12,26,48,.72);max-width:46ch;font-size:.97rem}
.svc .ar{width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);transition:background .3s,color .3s,border-color .3s,transform .35s}
.svc a:hover .ar{background:var(--accent);color:#fff;border-color:var(--accent);transform:rotate(-45deg)}
@media(max-width:900px){.sv{grid-template-columns:1fr}.sv-l{position:static}.sv-l .fr{aspect-ratio:16/10}}
@media(max-width:480px){.svc a{grid-template-columns:2rem 1fr 2.2rem;gap:.7rem}.svc .ar{width:2.2rem;height:2.2rem}}
/* diferenciais */
.dif-head{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(1.5rem,5vw,4rem);align-items:end}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:3rem}
.cd{height:100%;padding:1.8rem 1.5rem;border:1px solid rgba(244,239,230,.18);background:rgba(255,255,255,.03);transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .4s,background .4s}
.cd:hover{transform:translateY(-8px);border-color:var(--mint);background:rgba(111,224,184,.07)}
.cd .ic{width:52px;height:52px;border-radius:50%;border:1px solid rgba(111,224,184,.55);display:grid;place-items:center;color:var(--mint);margin-bottom:1.3rem}
.cd h3{font-size:1.65rem;line-height:1.1;margin-bottom:.6rem}
.cd p{line-height:1.6;font-size:.95rem;color:rgba(244,239,230,.78)}
@media(max-width:1000px){.cards{grid-template-columns:1fr 1fr}.dif-head{grid-template-columns:1fr}}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
.band{position:relative;overflow:hidden;height:clamp(320px,40vw,460px);margin-top:clamp(3rem,6vw,5rem);background:var(--navy2)}
.band .zi{position:absolute;inset:0}
.band img{position:absolute;left:0;width:100%;top:-12%;height:124%;object-fit:cover;object-position:50% 60%}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,18,31,.92),rgba(8,18,31,.78) 60%,rgba(8,18,31,.82))}
.band-in{position:absolute;inset:0;z-index:2;display:flex;align-items:center}
.band-in .wrap{display:flex;justify-content:space-between;align-items:center;gap:2rem;flex-wrap:wrap}
.band h3{font-size:clamp(1.9rem,4.2vw,3.4rem);line-height:1.05;max-width:16ch}
.band h3 em{color:var(--mint)}
.stats{display:flex;gap:clamp(1.5rem,4vw,3.5rem)}
.stat b{font-family:var(--font-display);font-weight:400;font-size:clamp(3rem,6vw,5rem);line-height:1;display:block;color:var(--mint)}
.stat span{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
/* passos */
.steps-sec{background:var(--sand2)}
.st{display:grid;grid-template-columns:5fr 6fr;gap:clamp(2rem,6vw,6rem);align-items:start}
.st-l{position:sticky;top:6rem}
.st-l .fr{aspect-ratio:4/5;margin-top:2rem}
.st-l .fr img{position:absolute;inset:0;width:100%;height:100%;object-position:55% 50%}
.steps{margin-top:2.2rem}
.step{display:grid;grid-template-columns:4rem 1fr;gap:1.3rem;position:relative;padding-bottom:2.4rem}
.step:not(:last-child)::before{content:"";position:absolute;left:2rem;top:4.2rem;bottom:.4rem;width:1px;background:var(--line)}
.step .nm{width:4rem;height:4rem;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-size:1.7rem;color:var(--accent);background:var(--sand2);position:relative;transition:background .3s,color .3s}
.step:hover .nm{background:var(--accent);color:#fff}
.step h3{font-size:1.75rem;line-height:1.1;margin:.4rem 0 .5rem}
.step p{line-height:1.65;color:rgba(12,26,48,.76);max-width:46ch}
@media(max-width:900px){.st{grid-template-columns:1fr}.st-l{position:static}.st-l .fr{aspect-ratio:16/10}}
/* identifica */
.idf{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,6rem);align-items:center}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.duo figure{margin:0}
.duo figure:nth-child(2){margin-top:3rem}
.duo .fr{aspect-ratio:3/4}
.duo .fr img{position:absolute;inset:0;width:100%;height:100%}
.duo figcaption{margin-top:.7rem;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:rgba(12,26,48,.7)}
.checks{margin-top:2rem;display:grid;gap:.4rem}
.chk{display:flex;gap:.9rem;align-items:flex-start;padding:.9rem 1rem;border:1px solid var(--line);background:rgba(255,255,255,.4);line-height:1.5;font-weight:500;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s}
.chk:hover{transform:translateX(6px);background:#fff;border-color:var(--accent)}
.chk i{flex:none;width:24px;height:24px;border-radius:4px;background:var(--accent);color:#fff;display:grid;place-items:center;margin-top:1px}
.idf .lp-btn{margin-top:1.8rem}
@media(max-width:900px){.idf{grid-template-columns:1fr}}
@media(max-width:480px){.duo figure:nth-child(2){margin-top:1.5rem}}
/* depoimentos */
.tq{display:grid;grid-template-columns:7fr 5fr;gap:1.2rem;margin-top:3rem}
.tq .side{display:grid;gap:1.2rem}
.tq figure{margin:0;height:100%}
.tq .cd{padding:2rem}
.tq .big blockquote{font-family:var(--font-display);font-size:clamp(1.7rem,3.2vw,2.6rem);line-height:1.18;margin:0}
.tq .big .qm{font-family:var(--font-display);font-size:5rem;line-height:.6;color:var(--mint);display:block;height:2.2rem}
.tq blockquote{margin:0;line-height:1.6;font-size:1.05rem}
.tq figcaption{margin-top:1.4rem;color:var(--mint);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.75rem}
.tag-il{display:inline-block;margin-top:1.4rem;font-size:.78rem;opacity:.75;font-style:italic}
@media(max-width:900px){.tq{grid-template-columns:1fr}}
/* final */
.final{background:#0b6b52;color:#fff;overflow:hidden;--accent:#fff;--on-accent:var(--navy)}
.final-bg{position:absolute;inset:0}
.final-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.14;mix-blend-mode:luminosity}
.final .wrap{position:relative;display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(2rem,5vw,5rem);align-items:center}
.final h2 em{color:#d8fff1}
.final p{margin-top:1.2rem;line-height:1.7;max-width:44ch;font-size:1.06rem;color:rgba(255,255,255,.92)}
.box{border:1px solid rgba(255,255,255,.4);padding:clamp(1.5rem,3vw,2.2rem);background:rgba(8,18,31,.28)}
.box small{display:block;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:.72rem;margin-bottom:.4rem}
.box .big-tel{font-family:var(--font-display);font-size:clamp(2.2rem,5vw,3.2rem);line-height:1.05;display:block;margin-bottom:1.3rem;transition:opacity .3s}
.box .big-tel:hover{opacity:.8}
.box .lp-btn{width:100%;justify-content:center}
@media(max-width:900px){.final .wrap{grid-template-columns:1fr}}
/* rodapé */
footer{background:var(--navy3);color:rgba(244,239,230,.78);padding:3.6rem 0 6rem;--accent:var(--mint)}
.fg{display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:3rem}
footer h4{font-family:var(--font-display);font-weight:400;font-size:1.5rem;color:var(--sand);margin:0 0 1rem}
footer li{display:flex;gap:.7rem;margin-bottom:.7rem;line-height:1.5}
footer li svg{flex:none;color:var(--mint);margin-top:3px}
footer a:hover{color:#fff;text-decoration:underline}
footer .logo{color:var(--sand);margin-bottom:1rem}
.cp{margin-top:2.6rem;padding-top:1.4rem;border-top:1px solid rgba(244,239,230,.14);font-size:.82rem;opacity:.7}
@media(max-width:760px){.fg{grid-template-columns:1fr;gap:2rem}}
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/htm.umd.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/lenis.min.js"></script>
<script src="shared/kit.js"></script>
<script>
(function(){
var LP = window.LP, html = LP.html, Ico = LP.Ico, Img = LP.Img, WaButton = LP.WaButton, Marquee = LP.Marquee;
var MSG = 'Olá! Vi a prévia do site da Contábil Service e gostaria de conversar sobre os serviços contábeis.';

function Nav(){ return html`<nav className="nav" aria-label="Principal"><div className="wrap"><a href="#inicio" className="logo" aria-label="Contábil Service Assessoria — início"><b>CS</b>Contábil Service</a>
  <ul><li><a href="#servicos">Serviços</a></li><li><a href="#departamentos">Departamentos</a></li><li><a href="#como-funciona">Como funciona</a></li><li><a href="#contato">Contato</a></li></ul>
  <${WaButton} magnetic=${false} msg=${MSG}>Falar agora<//></div></nav>`; }

function Hero(){ return html`<header className="hero dk" id="inicio" data-spot><div className="wrap hero-grid">
  <div>
    <span className="eb" data-hero-in>Assessoria contábil · Serra, ES</span>
    <h1 data-split data-hero>Contabilidade que <em>organiza</em> hoje e <em>protege</em> o amanhã do seu negócio.</h1>
    <p className="sub" data-hero-in>Abertura de empresas, consultoria fiscal, imposto de renda e departamento pessoal reunidos num só escritório, com atendimento próximo e linguagem que você entende.</p>
    <ul className="ticks" data-hero-in>
      <li><i><${Ico} name="check" size=${14} sw=${2.6} /></i>Atendimento por WhatsApp ou telefone</li>
      <li><i><${Ico} name="check" size=${14} sw=${2.6} /></i>Departamentos Fiscal, Pessoal e Registro</li>
      <li><i><${Ico} name="check" size=${14} sw=${2.6} /></i>Da abertura ao encerramento da empresa</li>
    </ul>
    <div className="cta-row" data-hero-in>
      <${WaButton} msg=${MSG}>Conversar no WhatsApp<//>
      <a className="tel" href="tel:+552733287879"><${Ico} name="phone" size=${18} />(27) 3328-7879</a>
    </div>
  </div>
  <div className="hero-vis" data-reveal="zoom" data-delay="0.2">
    <div className="fr"><div className="zi"><${Img} src="img/cont-5.jpg" alt="Profissional de contabilidade analisando documentos em seu posto de trabalho" eager=${true} /></div></div>
    <div className="float"><small>Três frentes</small><span>Fiscal · Pessoal · Registro</span></div>
  </div></div></header>`; }

var SV = [
  ['Abertura, alteração e encerramento de empresas','Do primeiro registro à baixa: cuidamos dos trâmites e da papelada para você focar no negócio.'],
  ['Consultoria e auditoria contábil','Uma leitura atenta dos seus números para decidir com mais clareza e enxergar onde melhorar.'],
  ['Consultoria fiscal e tributária','Entenda suas obrigações e conte com orientação para manter a empresa em dia com o fisco.'],
  ['Imposto de renda pessoa física','Declaração preparada com cuidado, com a documentação organizada e atenção às regras.'],
  ['Departamento pessoal e RH','Rotinas de pessoal em dia: admissões, folha de pagamento e obrigações trabalhistas.'],
  ['Despachante empresarial','Acompanhamento de processos e documentos da empresa junto aos órgãos públicos.']
];
function Servicos(){ return html`<section className="pad" id="servicos"><div className="wrap sv">
  <div className="sv-l">
    <span className="eb" data-reveal>Serviços</span>
    <h2 data-split>Tudo o que sua empresa precisa, <em>num só lugar.</em></h2>
    <p className="lead" data-reveal>Toque em um serviço para falar direto com a equipe sobre ele no WhatsApp.</p>
    <div className="fr" data-reveal="mask"><div className="zi"><${Img} src="img/cont-2.jpg" alt="Calculadora, gráficos e pastas de documentos sobre uma mesa" /></div></div>
  </div>
  <ul data-stagger>
    ${SV.map(function(s,i){ return html`<li className="svc" key=${i}><a href=${LP.wa('Olá! Gostaria de saber mais sobre: '+s[0]+'.')} target="_blank" rel="noopener">
      <span className="n">0${i+1}</span><div><h3>${s[0]}</h3><p>${s[1]}</p></div><span className="ar"><${Ico} name="arrow" size=${18} /></span></a></li>`; })}
  </ul></div></section>`; }

var DIF = [
  ['file','Fiscal','Apuração, obrigações acessórias e orientação tributária para o negócio seguir regular.'],
  ['users','Pessoal','Admissões, folha e rotinas trabalhistas conduzidas com organização e cuidado.'],
  ['scale','Registro','Abertura, alteração e baixa de empresas, com acompanhamento dos documentos.'],
  ['spark','Incentivos estaduais','Apoio a empresas interessadas em programas de incentivo estadual.']
];
function Diferenciais(){ return html`<section className="pad dk" id="departamentos"><div className="wrap">
  <div className="dif-head"><div><span className="eb" data-reveal>Departamentos</span><h2 data-split>Três departamentos, <em>um parceiro</em> para o seu negócio.</h2></div>
  <p className="lead" data-reveal>Cada área cuida de uma parte da rotina da empresa, e todas conversam entre si para você não precisar correr atrás de vários prestadores.</p></div>
  <div className="cards" data-stagger>
