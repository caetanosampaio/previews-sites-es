<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pet Feliz — Pet Shop em Jardim da Penha, Vitória | Prévia de site</title>
<meta name="description" content="Prévia de site para o Pet Feliz Pet Shop, em Jardim da Penha, Vitória (ES): banho e tosa, produtos naturais e orgânicos, rações, camas e atendimento veterinário.">
<meta property="og:title" content="Pet Feliz — Seu pet merece um dia de festa">
<meta property="og:description" content="Prévia de site criada para o Pet Feliz Pet Shop, Jardim da Penha, Vitória (ES).">
<meta property="og:image" content="img/pet-5.jpg">
<meta name="theme-color" content="#fff6d9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/kit.css">
<style>
:root{--bg:#fff6d9;--fg:#2a2417;--accent:#c2410c;--on-accent:#ffffff;--sun:#ffd23f;--leaf:#1e5a34;--leaf2:#2f7d4a;--mint:#d6efd0;--peach:#ffd9cb;--cream:#fffdf5;--muted:#554c38;
--intro-bg:#fff6d9;--intro-fg:#2a2417;--intro-ls:0;
--font-display:'Baloo 2','Nunito',system-ui,sans-serif;--font-body:'Nunito',system-ui,sans-serif;--ink:3px solid #2a2417}
body{line-height:1.5;font-weight:500}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px;border-radius:8px}
.wrap{width:min(1180px,calc(100% - 40px));margin-inline:auto}
section{position:relative}
.pad{padding:clamp(4rem,9vw,7rem) 0}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.01em}
h2{font-weight:800;font-size:clamp(2.1rem,5vw,3.6rem);line-height:1.02}
.lead{color:var(--muted);font-size:1.1rem;line-height:1.65;max-width:50ch;margin-top:1rem}
.eb{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;color:var(--fg);background:var(--sun);border:2px solid var(--fg);border-radius:999px;padding:.25rem .9rem;margin-bottom:1rem;rotate:-2deg}
.mark{background:linear-gradient(transparent 58%,var(--sun) 58%,var(--sun) 92%,transparent 92%)}
.hot{color:var(--accent)}

/* botões */
.lp-btn{font-family:var(--font-display);font-weight:700;font-size:1.05rem;border:var(--ink);box-shadow:4px 4px 0 var(--fg)}
.lp-btn:hover{box-shadow:6px 6px 0 var(--fg);filter:none}
.lp-btn:active{box-shadow:1px 1px 0 var(--fg)}
.lp-btn.ghost{background:var(--cream);color:var(--fg)}
.lp-btn.sun{background:var(--sun);color:var(--fg)}
.lp-btn.cream{background:var(--cream);color:var(--fg)}

/* patas decorativas */
.paw{display:block;fill:currentColor}
.pw{position:absolute;color:var(--leaf);opacity:.13;pointer-events:none;z-index:0;animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-3deg)}}

/* nav */
.nav{position:fixed;inset:0 0 auto 0;z-index:800;padding:.8rem 0;transition:background .3s,padding .3s,border-color .3s;border-bottom:3px solid transparent}
.nav.scrolled{background:var(--cream);padding:.5rem 0;border-bottom-color:var(--fg)}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;gap:.8rem}
.logo{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-weight:800;font-size:1.45rem;line-height:1}
.logo .pb{width:42px;height:42px;border-radius:50%;background:var(--sun);border:2.5px solid var(--fg);display:grid;place-items:center;flex:none;color:var(--fg);transition:transform .4s}
.logo:hover .pb{transform:rotate(-14deg) scale(1.08)}
.logo small{display:block;font-family:var(--font-body);font-weight:700;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.nav ul{display:flex;gap:1.8rem;font-weight:700;font-size:.98rem}
.nav ul a{padding:.4rem 0;position:relative}
.nav ul a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:var(--accent);transform:scaleX(0);transition:transform .3s}
.nav ul a:hover::after{transform:scaleX(1)}
.nav .lp-btn{padding:.6rem 1.1rem;font-size:.98rem}
@media(max-width:860px){.nav ul{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;padding:clamp(7rem,12vw,8.5rem) 0 clamp(3.5rem,7vw,5.5rem);background-color:var(--bg);background-image:radial-gradient(rgba(42,36,23,.11) 1.6px,transparent 1.7px);background-size:24px 24px}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.hero h1{font-weight:800;font-size:clamp(2.6rem,7vw,5.7rem);line-height:.96;letter-spacing:-.02em}
.hero .lead{font-size:clamp(1.05rem,1.7vw,1.25rem);max-width:46ch;margin-top:1.3rem}
.cta-row{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2rem}
.trust{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem}
.trust li{display:inline-flex;align-items:center;gap:.45rem;background:var(--cream);border:2px solid var(--fg);border-radius:999px;padding:.35rem .85rem;font-weight:700;font-size:.88rem}
.trust svg{color:var(--leaf);flex:none}
.photo{position:relative;justify-self:center;width:min(100%,440px)}
.frame{position:relative;aspect-ratio:4/5;border:4px solid var(--fg);border-radius:44px 44px 44px 120px;overflow:hidden;background:#e8641c;box-shadow:10px 10px 0 var(--leaf);rotate:2deg;transition:rotate .5s,box-shadow .5s}
.frame:hover{rotate:0deg;box-shadow:14px 14px 0 var(--leaf)}
.frame img{transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.frame:hover img{transform:scale(1.05)}
.rate{position:absolute;z-index:3;left:-26px;bottom:8%;width:132px;height:132px;border-radius:50%;background:var(--sun);border:3px solid var(--fg);box-shadow:5px 5px 0 var(--fg);display:grid;place-content:center;text-align:center;line-height:1;animation:wob 5s ease-in-out infinite}
.rate b{font-family:var(--font-display);font-size:2.4rem;font-weight:800}
.rate .stars{display:flex;justify-content:center;margin:.1rem 0 .2rem}
.rate span{font-size:.72rem;font-weight:800;line-height:1.15}
.stars svg{fill:currentColor}
.tag{position:absolute;z-index:3;right:-8px;top:7%;background:var(--accent);color:#fff;border:3px solid var(--fg);border-radius:999px;box-shadow:4px 4px 0 var(--fg);padding:.45rem 1rem;font-family:var(--font-display);font-weight:700;font-size:1rem;rotate:6deg;display:flex;align-items:center;gap:.4rem}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}.photo{width:min(100%,380px)}}
@media(max-width:420px){.rate{left:-8px;width:112px;height:112px}.rate b{font-size:2rem}.tag{right:-4px;font-size:.9rem}}

.scal{height:14px;background:radial-gradient(circle at 50% 100%,var(--leaf) 13px,transparent 14px) 0 0/28px 14px repeat-x,var(--bg);position:relative;z-index:2}
.mq{background:var(--leaf);color:var(--sun);font-family:var(--font-display);font-weight:700;font-size:clamp(1.2rem,3vw,1.9rem);padding:.7rem 0 .8rem}

/* diferenciais */
.center{text-align:center}.center .lead{margin-inline:auto}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem;margin-top:3rem}
.tiles>div{display:flex}
.tile{flex:1;position:relative;overflow:hidden;border:var(--ink);border-radius:30px;padding:1.7rem 1.5rem 1.8rem;box-shadow:6px 6px 0 var(--fg);transition:translate .35s cubic-bezier(.2,.8,.2,1),rotate .35s,box-shadow .35s}
.tiles>div:nth-child(1) .tile{background:var(--mint);rotate:-1.2deg}
.tiles>div:nth-child(2) .tile{background:var(--peach);rotate:1deg}
.tiles>div:nth-child(3) .tile{background:var(--sun);rotate:-.8deg}
.tiles>div:nth-child(4) .tile{background:var(--cream);rotate:1.2deg}
.tile:hover{translate:-3px -8px;rotate:0deg;box-shadow:10px 12px 0 var(--fg)}
.tile .ib{width:64px;height:64px;border-radius:20px;background:var(--cream);border:2.5px solid var(--fg);display:grid;place-items:center;color:var(--leaf);transition:transform .45s}
.tiles>div:nth-child(4) .tile .ib{background:var(--sun)}
.tile:hover .ib{transform:rotate(-10deg) scale(1.08)}
.tile h3{font-size:1.5rem;font-weight:800;line-height:1.1;margin:1.1rem 0 .5rem}
.tile p{color:var(--fg);line-height:1.55;font-size:1rem}
.tile .wm{position:absolute;right:-18px;bottom:-18px;width:96px;color:var(--fg);opacity:.07;rotate:-20deg}
@media(max-width:1000px){.tiles{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.tiles{grid-template-columns:1fr}}

/* serviços */
.srv{background:var(--leaf);color:var(--cream);overflow:hidden}
.srv h2 .hot{color:var(--sun)}
.srv .lead{color:rgba(255,253,245,.88)}
.srv .pw{color:var(--cream);opacity:.07}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;margin-top:3rem;position:relative;z-index:1}
.sgrid>div{display:flex}
.sc{flex:1;display:grid;grid-template-columns:42% 1fr;background:var(--cream);color:var(--fg);border:var(--ink);border-radius:32px;overflow:hidden;box-shadow:7px 7px 0 var(--fg);transition:translate .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;min-width:0}
.sc:hover{translate:-3px -6px;box-shadow:11px 12px 0 var(--fg)}
.sc .im{position:relative;overflow:hidden;min-height:240px;border-right:var(--ink)}
.sc .im img{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.sc:hover .im img{transform:scale(1.08)}
.sc .tx{padding:1.5rem 1.4rem;display:flex;flex-direction:column;justify-content:center;gap:.5rem}
.sc h3{font-size:1.5rem;font-weight:800;line-height:1.08}
.sc p{color:var(--muted);line-height:1.55;font-size:.97rem}
.sc .go{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-display);font-weight:700;color:var(--accent);margin-top:.3rem}
.sc .go svg{transition:transform .3s}
.sc:hover .go svg{transform:translateX(5px)}
@media(max-width:1000px){.sgrid{grid-template-columns:1fr}}
@media(max-width:560px){.sc{grid-template-columns:1fr}.sc .im{min-height:0;aspect-ratio:16/10;border-right:0;border-bottom:var(--ink)}}

/* prova social */
.prova{overflow:hidden}
.pgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(2rem,5vw,4.5rem);align-items:center;margin-top:1rem;position:relative;z-index:1}
.score{background:var(--sun);border:var(--ink);border-radius:40px;box-shadow:9px 9px 0 var(--fg);padding:2.2rem 1.8rem;text-align:center;rotate:-2deg;position:relative}
.score b{display:block;font-family:var(--font-display);font-size:clamp(5rem,12vw,7.5rem);font-weight:800;line-height:.9}
.score .stars{display:flex;justify-content:center;gap:4px;margin:.6rem 0}
.score p{font-weight:800;font-size:1.1rem;line-height:1.35}
.score small{display:block;margin-top:.6rem;font-weight:700;font-size:.82rem;color:#3a311c}
.score .lp-btn{margin-top:1.3rem}
.bubbles{display:grid;gap:1.3rem}
.bubbles>div:nth-child(2){margin-left:clamp(0px,4vw,3rem)}
.bub{position:relative;background:var(--cream);border:var(--ink);border-radius:30px 30px 30px 8px;padding:1.5rem 1.6rem;box-shadow:6px 6px 0 var(--fg);transition:translate .35s,box-shadow .35s}
.bub:hover{translate:-3px -5px;box-shadow:9px 10px 0 var(--fg)}
.bub blockquote{margin:0;font-size:1.08rem;line-height:1.6;font-weight:600}
.bub figcaption{display:flex;align-items:center;gap:.6rem;margin-top:1rem;font-weight:800;font-size:.9rem;color:var(--leaf)}
.bub figcaption i{width:30px;height:30px;border-radius:50%;background:var(--mint);border:2px solid var(--fg);display:grid;place-items:center;color:var(--fg);flex:none}
.bub figure{margin:0}
.il{display:inline-block;font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;border:2px dashed var(--fg);border-radius:999px;padding:.3rem .9rem;margin-top:1.2rem;background:var(--cream)}
@media(max-width:900px){.pgrid{grid-template-columns:1fr}.score{max-width:420px;justify-self:center}.bubbles>div:nth-child(2){margin-left:0}}

/* galeria */
.gal{background:var(--sun);border-top:var(--ink);overflow:hidden}
.pol{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem;margin-top:3rem;align-items:start}
.pol>div{display:flex}
.pl{flex:1;background:#fff;border:var(--ink);border-radius:18px;padding:10px 10px 0;box-shadow:6px 6px 0 var(--fg);transition:translate .35s cubic-bezier(.2,.8,.2,1),rotate .35s,box-shadow .35s}
.pol>div:nth-child(1) .pl{rotate:-3deg}.pol>div:nth-child(2) .pl{rotate:2deg;margin-top:1.4rem}.pol>div:nth-child(3) .pl{rotate:-1.5deg}.pol>div:nth-child(4) .pl{rotate:3deg;margin-top:1.4rem}
.pl:hover{translate:0 -8px;rotate:0deg;box-shadow:10px 12px 0 var(--fg)}
.pl .im{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;border:2px solid var(--fg)}
.pl .im img{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.pl:hover .im img{transform:scale(1.08)}
.pl figcaption{font-family:var(--font-display);font-weight:700;font-size:1.05rem;text-align:center;padding:.7rem 0 .8rem}
.pl{margin:0}
@media(max-width:900px){.pol{grid-template-columns:1fr 1fr}.pol>div:nth-child(n) .pl{margin-top:0}}
@media(max-width:420px){.pol{gap:1rem}.pl figcaption{font-size:.92rem}}

/* final */
.final{background:var(--accent);color:#fff;text-align:center;overflow:hidden;padding:clamp(5rem,10vw,8rem) 0}
.final .pw{color:#fff;opacity:.1}
.final h2{font-size:clamp(2.4rem,7vw,5.2rem);line-height:.98}
.final h2 .sunw{color:var(--sun)}
.final p{max-width:46ch;margin:1.2rem auto 2rem;font-size:1.15rem;line-height:1.6;font-weight:600}
.final .cta-row{justify-content:center}
.final .wrap{position:relative;z-index:1}
.scal.o{background:radial-gradient(circle at 50% 100%,var(--accent) 13px,transparent 14px) 0 0/28px 14px repeat-x,var(--sun)}

footer{background:#14241a;color:rgba(255,253,245,.82);padding:3.4rem 0 6rem}
.fg{display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:3rem}
footer .logo{color:#fff;margin-bottom:1rem}
footer .logo small{color:rgba(255,253,245,.7)}
footer h4{color:var(--sun);font-size:1.15rem;font-weight:700;margin-bottom:1rem}
footer li{display:flex;gap:.7rem;margin-bottom:.8rem;line-height:1.5}
footer li svg{flex:none;color:var(--sun);margin-top:3px}
footer a:not(.lp-btn){text-decoration:underline;text-decoration-color:rgba(255,210,63,.5);text-underline-offset:3px}
footer a:not(.lp-btn):hover{color:#fff;text-decoration-color:var(--sun)}
footer :focus-visible{outline-color:var(--sun)}
.cp{margin-top:2.4rem;padding-top:1.4rem;border-top:1px solid rgba(255,253,245,.16);font-size:.84rem;color:rgba(255,253,245,.72)}
@media(max-width:820px){.fg{grid-template-columns:1fr;gap:2rem}}

@media (prefers-reduced-motion:reduce){.pw,.rate{animation:none!important}.tile,.sc,.bub,.pl,.frame,.frame img,.sc .im img,.pl .im img{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/htm.umd.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/lenis.min.js"></script>
<script src="shared/kit.js"></script>
<script>
(function(){
var LP = window.LP, html = LP.html, Ico = LP.Ico, Img = LP.Img, WaButton = LP.WaButton, Marquee = LP.Marquee;
var MSG = 'Olá! Vi a prévia do site do Pet Feliz e gostaria de agendar um banho e tosa.';
var TEL = '(27) 3029-2266';
var MAPS = 'https://www.google.com/maps/search/?api=1&query=R.+Arist%C3%B3bulo+Barbosa+Le%C3%A3o+576+Jardim+da+Penha+Vit%C3%B3ria+ES';

function Paw(p){ return html`<svg className=${'paw ' + (p.className || '')} style=${p.style} width=${p.size || 24} height=${p.size || 24} viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="42" rx="15" ry="12"/><ellipse cx="13" cy="29" rx="6" ry="8"/><ellipse cx="25" cy="16" rx="6.2" ry="8.6"/><ellipse cx="40" cy="16" rx="6.2" ry="8.6"/><ellipse cx="52" cy="29" rx="6" ry="8"/></svg>`; }
function Paws(p){ return (p.items || []).map(function(a,i){ return html`<span className="pw" key=${i} aria-hidden="true" style=${{left:a[0],top:a[1],rotate:a[2]+'deg',animationDelay:(-i*1.3)+'s'}}><${Paw} size=${a[3]} /></span>`; }); }
function Stars(p){ return html`<div className="stars" role="img" aria-label="Nota 4,7 de 5">${[0,1,2,3,4].map(function(k){ return html`<${Ico} key=${k} name="star" size=${p.size || 16} sw=${1.8} />`; })}</div>`; }

function Nav(){ return html`<nav className="nav" aria-label="Principal"><div className="wrap">
  <a href="#inicio" className="logo" aria-label="Pet Feliz — início"><span className="pb"><${Paw} size=${24} /></span><span>Pet Feliz<small>Pet Shop</small></span></a>
  <ul><li><a href="#diferenciais">Diferenciais</a></li><li><a href="#servicos">Serviços</a></li><li><a href="#avaliacoes">Avaliações</a></li><li><a href="#contato">Contato</a></li></ul>
  <${WaButton} magnetic=${false} msg=${MSG}>Agendar<//></div></nav>`; }

function Hero(){ return html`<header className="hero" id="inicio">
  <${Paws} items=${[['4%','18%',-20,56],['46%','8%',15,40],['92%','46%',25,60],['3%','78%',10,44],['58%','88%',-15,52]]} />
  <div className="wrap hero-grid">
    <div>
      <span className="eb" data-hero-in>Jardim da Penha · Vitória</span>
      <h1 data-split data-hero>Seu pet merece um dia de <span className="hot mark">festa!</span></h1>
      <p className="lead" data-hero-in>Banho e tosa com carinho, produtos naturais e orgânicos, rações, camas e atendimento veterinário. Tudo pertinho de você, no Jardim da Penha.</p>
      <div className="cta-row" data-hero-in>
        <${WaButton} msg=${MSG}>Agendar banho e tosa<//>
        <a className="lp-btn ghost" href="tel:+552730292266"><${Ico} name="phone" size=${18} /> <span>${TEL}</span></a>
      </div>
      <ul className="trust" data-hero-in>
        <li><${Ico} name="star" size=${16} sw=${2} /> 4,7 no Google · 142 avaliações</li>
        <li><${Ico} name="check" size=${16} sw=${3} /> Acesso para cadeirantes</li>
        <li><${Ico} name="car" size=${16} sw=${2} /> Estacionamento ao lado</li>
      </ul>
    </div>
    <div className="photo" data-hero-in>
      <div className="frame"><${Img} className="lp-cover" src="img/pet-5.jpg" alt="Filhote de corgi sentado olhando para cima, em fundo laranja" eager=${true} /></div>
      <div className="rate" aria-label="4,7 no Google, 142 avaliações"><b>4,7</b><${Stars} size=${12} /><span>no Google<br/>142 avaliações</span></div>
      <div className="tag"><${Ico} name="scissors" size=${18} sw=${2.2} /> Banho e tosa</div>
    </div>
  </div></header>`; }

var DIF = [
  ['leaf','Natural e orgânico','Produtos naturais e orgânicos para quem quer cuidar do bem-estar do pet com mais carinho.'],
  ['heart','Veterinário por perto','Atendimento veterinário para cuidar da saúde do seu pet sem precisar ir longe.'],
  ['users','Loja para todos','Acesso para cadeirantes: todo tutor é bem-vindo, com conforto e sem barreiras.'],
  ['car','Estacionamento ao lado','Estacionamento na rua ao lado da loja, para facilitar a sua visita.']
];
function Diferenciais(){ return html`<section className="pad" id="diferenciais" style=${{overflow:'hidden'}}><div className="wrap">
  <div className="center"><span className="eb" data-reveal>Por que a Pet Feliz</span><h2 data-split>Um cantinho feito para quem <span className="hot mark">ama pet</span></h2>
  <p className="lead" data-reveal>Do banho ao petisco, do veterinário à caminha: tudo para o seu melhor amigo, num lugar fácil de chegar.</p></div>
  <div className="tiles" data-stagger>
    ${DIF.map(function(x,i){ return html`<div key=${i}><div className="tile"><${Paw} className="wm" size=${96} /><div className="ib"><${Ico} name=${x[0]} size=${30} sw=${1.9} /></div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`; })}
  </div></div></section>`; }

var SRV = [
  ['Banho e tosa','Banho, tosa e aquele cheirinho de limpeza. Cuidado com carinho do começo ao fim, para o seu pet sair lindo e feliz.','img/pet-8.jpg','Tosadora com tesoura aparando o pelo de um cachorrinho branco sobre a mesa de tosa','banho e tosa','50% 50%'],
