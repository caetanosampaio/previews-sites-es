<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bocas e Dentes — Odontologia em Vila Velha | Prévia de site</title>
<meta name="description" content="Prévia de site para a Bocas e Dentes, odontologia no Centro de Vila Velha (ES).">
<meta property="og:title" content="Bocas e Dentes — Sorrir sem medo é só o começo">
<meta property="og:description" content="Prévia de site criada para a Bocas e Dentes, Vila Velha (ES).">
<meta property="og:image" content="img/odonto-4.jpg">
<meta name="theme-color" content="#0e3b3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/kit.css">
<style>
:root{--bg:#fbf7f1;--fg:#10302f;--accent:#ff6b57;--on-accent:#fff;--teal:#0e3b3a;--mint:#dff0ea;--sand:#f3ebdf;--intro-bg:#0e3b3a;--intro-fg:#fff;
--font-display:'Fraunces',Georgia,serif;--font-body:'Plus Jakarta Sans',system-ui,sans-serif}
.wrap{width:min(1180px,calc(100% - 48px));margin-inline:auto}
em{font-style:italic;color:var(--accent)}
/* nav */
.nav{position:fixed;inset:0 0 auto 0;z-index:800;transition:background .4s,backdrop-filter .4s,padding .4s;padding:1.3rem 0;color:#fff}
.nav.scrolled{background:rgba(251,247,241,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:.75rem 0;color:var(--fg);box-shadow:0 1px 0 rgba(16,48,47,.08)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{font-family:var(--font-display);font-weight:600;font-size:1.45rem;display:flex;align-items:center;gap:.5rem;letter-spacing:-.01em}
.logo i{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-style:normal}
.nav ul{display:flex;gap:2rem;font-weight:600;font-size:.92rem}
.nav ul a{opacity:.85;position:relative}.nav ul a:hover{opacity:1}
.nav .lp-btn{padding:.7rem 1.15rem;font-size:.9rem}
@media(max-width:820px){.nav ul{display:none}}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;background:var(--teal);color:#fff}
.hero-bg{position:absolute;inset:0}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,36,35,.92) 0%,rgba(8,36,35,.55) 48%,rgba(8,36,35,.15) 100%),linear-gradient(0deg,rgba(8,36,35,.85) 0%,transparent 45%)}
.hero-in{position:relative;padding:0 0 clamp(4rem,10vh,7rem);width:min(1180px,calc(100% - 48px));margin-inline:auto}
.eyebrow{display:inline-flex;align-items:center;gap:.6rem;font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#bfe9de;margin-bottom:1.4rem}
.eyebrow::before{content:"";width:34px;height:1px;background:currentColor}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.8rem,8.4vw,7.2rem);line-height:.98;letter-spacing:-.03em;max-width:12ch}
.hero h1 em{color:#ff9a8b}
.lead{max-width:46ch;margin-top:1.6rem;font-size:clamp(1rem,1.6vw,1.2rem);line-height:1.65;color:rgba(255,255,255,.82)}
.cta{display:flex;flex-wrap:wrap;gap:1rem;margin-top:2.2rem;align-items:center}
.ghost{display:inline-flex;gap:.5rem;align-items:center;padding:1rem 1.4rem;border-radius:999px;border:1px solid rgba(255,255,255,.4);font-weight:600;backdrop-filter:blur(8px);transition:.3s}
.ghost:hover{background:#fff;color:var(--teal)}
.chips{position:absolute;right:max(24px,calc((100vw - 1180px)/2));bottom:clamp(4rem,10vh,7rem);display:grid;gap:.8rem;z-index:2}
.chip{display:flex;gap:.8rem;align-items:center;padding:.9rem 1.2rem;border-radius:18px;background:rgba(255,255,255,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.22);font-weight:600;font-size:.92rem;animation:bob 6s ease-in-out infinite}
.chip:nth-child(2){animation-delay:-2s;margin-left:2rem}.chip:nth-child(3){animation-delay:-4s}
.chip svg{color:#ff9a8b}
@keyframes bob{50%{transform:translateY(-8px)}}
@media(max-width:900px){.chips{display:none}}
/* marquee */
.band{background:var(--accent);color:#fff;padding:1.1rem 0;font-family:var(--font-display);font-size:clamp(1.3rem,3vw,2rem);font-style:italic}
/* sections */
section{padding:clamp(4.5rem,10vw,8rem) 0}
.kicker{font-size:.78rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;display:block}
h2{font-family:var(--font-display);font-weight:400;font-size:clamp(2.1rem,5vw,4rem);line-height:1.04;letter-spacing:-.025em}
.sec-head{max-width:760px;margin-bottom:3.2rem}
.sec-head p{margin-top:1.1rem;font-size:1.1rem;line-height:1.7;opacity:.75}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem}
.card{background:#fff;border-radius:26px;padding:2rem 1.7rem;box-shadow:0 1px 0 rgba(16,48,47,.06),0 24px 50px -30px rgba(16,48,47,.35);transition:box-shadow .4s,background .4s,color .4s;will-change:transform;position:relative;overflow:hidden}
.card:hover{background:var(--teal);color:#fff;box-shadow:0 30px 60px -25px rgba(14,59,58,.7)}
.card .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--mint);color:var(--teal);margin-bottom:1.4rem;transition:.4s}
.card:hover .ic{background:var(--accent);color:#fff;transform:rotate(-8deg) scale(1.08)}
.card h3{font-family:var(--font-display);font-size:1.4rem;font-weight:500;margin-bottom:.6rem}
.card p{opacity:.72;line-height:1.6;font-size:.96rem}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid4{grid-template-columns:1fr}}
/* tratamentos */
.treat{background:var(--teal);color:#fff;position:relative;overflow:hidden}
.treat h2 em{color:#ff9a8b}
.treat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.t-list li{border-top:1px solid rgba(255,255,255,.18);padding:1.5rem 0;cursor:pointer;transition:padding .4s,opacity .4s;opacity:.55}
.t-list li:last-child{border-bottom:1px solid rgba(255,255,255,.18)}
.t-list li.on{opacity:1;padding-left:1.2rem}
.t-list h3{font-family:var(--font-display);font-weight:400;font-size:clamp(1.6rem,3vw,2.4rem);display:flex;justify-content:space-between;align-items:center;gap:1rem}
.t-list h3 svg{transition:.4s;opacity:0;transform:translateX(-10px)}
.t-list li.on h3 svg{opacity:1;transform:none;color:#ff9a8b}
.t-list p{max-height:0;overflow:hidden;opacity:0;transition:max-height .5s,opacity .5s,margin .5s;line-height:1.6;color:#cfe7e0;max-width:44ch}
.t-list li.on p{max-height:120px;opacity:1;margin-top:.7rem}
.t-visual{position:relative;aspect-ratio:4/5;border-radius:240px 240px 28px 28px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.t-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity .8s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.t-visual img.on{opacity:1;transform:scale(1)}
.spin{position:absolute;right:-30px;top:-30px;width:130px;height:130px;z-index:3}
.spin svg{animation:rot 18s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media(max-width:900px){.treat-grid{grid-template-columns:1fr;gap:2.5rem}.t-visual{max-width:420px;margin-inline:auto;width:100%}}
/* passos */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem;counter-reset:s}
.step{position:relative;padding:2rem 1.5rem 1.6rem;border-radius:24px;background:var(--sand);counter-increment:s}
.step::before{content:"0" counter(s);font-family:var(--font-display);font-size:3.6rem;line-height:1;color:var(--accent);display:block;margin-bottom:1rem;font-style:italic}
.step h3{font-size:1.15rem;margin-bottom:.4rem;font-weight:700}
.step p{opacity:.72;line-height:1.55;font-size:.95rem}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.steps{grid-template-columns:1fr}}
/* depoimentos */
.proof{background:var(--sand)}
.t3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}
.quote{background:#fff;border-radius:26px;padding:2rem;display:flex;flex-direction:column;gap:1.2rem;box-shadow:0 24px 50px -34px rgba(16,48,47,.4)}
.stars{display:flex;gap:2px;color:#f5a524}
.quote p{font-family:var(--font-display);font-size:1.22rem;line-height:1.5}
.who{display:flex;align-items:center;gap:.8rem;margin-top:auto;font-weight:700;font-size:.92rem}
.who i{width:42px;height:42px;border-radius:50%;background:var(--mint);color:var(--teal);display:grid;place-items:center;font-style:normal;font-family:var(--font-display);font-size:1.1rem}
.who small{display:block;font-weight:500;opacity:.6}
@media(max-width:900px){.t3{grid-template-columns:1fr}}
/* cta final */
.final{position:relative;overflow:hidden;background:var(--teal);color:#fff;text-align:center}
.final img{opacity:.22}
.final .wrap{position:relative}
.final h2{max-width:16ch;margin:0 auto 1.4rem;font-size:clamp(2.4rem,6.4vw,5.4rem)}
.final h2 em{color:#ff9a8b}
.final p{max-width:48ch;margin:0 auto 2.2rem;opacity:.8;line-height:1.7;font-size:1.1rem}
.final .lp-btn{font-size:1.1rem;padding:1.2rem 2.2rem}
/* footer */
footer{background:#082423;color:#cfe7e0;padding:4rem 0 6rem}
.f-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:3rem}
footer h4{color:#fff;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:1.1rem}
footer li{display:flex;gap:.7rem;margin-bottom:.8rem;line-height:1.5;align-items:flex-start}
footer li svg{flex:none;margin-top:3px;color:#ff9a8b}
footer .logo{color:#fff;margin-bottom:1rem}
.copy{margin-top:3rem;padding-top:1.5rem;border-top:1px solid rgba(255,255,255,.12);font-size:.82rem;opacity:.6}
@media(max-width:800px){.f-grid{grid-template-columns:1fr;gap:2rem}}
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/htm.umd.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/lenis.min.js"></script>
<script src="shared/kit.js"></script>
<script>
(function(){
var LP = window.LP, html = LP.html, Ico = LP.Ico, Img = LP.Img, WaButton = LP.WaButton, Marquee = LP.Marquee;
var useState = React.useState;

var TRATAMENTOS = [
  { t:'Limpeza e prevenção', d:'Profilaxia, controle de tártaro e orientação de higiene para manter a saúde da boca em dia.', img:'img/odonto-2.jpg' },
  { t:'Clareamento dental', d:'Sorriso mais branco e luminoso, com acompanhamento profissional e sem sensibilidade desnecessária.', img:'img/odonto-5.jpg' },
  { t:'Estética do sorriso', d:'Restaurações e facetas que harmonizam formato, cor e proporção dos dentes.', img:'img/odonto-4.jpg' },
  { t:'Implantes e reabilitação', d:'Recupere função e confiança para mastigar, falar e sorrir com naturalidade.', img:'img/odonto-6.jpg' },
  { t:'Consulta e urgência', d:'Dor ou desconforto? Fale com a equipe e receba a orientação certa o quanto antes.', img:'img/odonto-8.jpg' }
];

function Nav(){
  return html`<nav className="nav"><div className="wrap">
    <a href="#inicio" className="logo"><i><${Ico} name="smile" size=${18} /></i>Bocas e Dentes</a>
    <ul><li><a href="#diferenciais">Diferenciais</a></li><li><a href="#tratamentos">Tratamentos</a></li><li><a href="#como">Como funciona</a></li><li><a href="#contato">Contato</a></li></ul>
    <${WaButton} magnetic=${false} msg="Olá! Vi o site da Bocas e Dentes e gostaria de agendar uma avaliação.">Agendar<//>
  </div></nav>`;
}

function Hero(){
  return html`<header className="hero" id="inicio">
    <div className="hero-bg"><${Img} className="lp-cover" src="img/odonto-4.jpg" alt="Paciente sorrindo" eager=${true} kb=${true} /></div>
    <div className="hero-in">
      <p className="eyebrow" data-hero-in>Odontologia · Centro de Vila Velha</p>
      <h1 data-split data-hero>Sorrir sem medo é só o <em>começo.</em></h1>
      <p className="lead" data-hero-in>Atendimento acolhedor, explicado passo a passo, para você cuidar do sorriso com tranquilidade — da primeira avaliação ao resultado que você sempre quis.</p>
      <div className="cta" data-hero-in>
        <${WaButton} msg="Olá! Gostaria de agendar uma avaliação na Bocas e Dentes.">Agendar minha avaliação<//>
        <a className="ghost" href="#tratamentos">Conhecer tratamentos <${Ico} name="arrow" size=${18} /></a>
      </div>
    </div>
    <div className="chips" data-hero-in>
      <div className="chip"><${Ico} name="heart" size=${20} /> Atendimento humanizado</div>
      <div className="chip"><${Ico} name="shield" size=${20} /> Cuidado com segurança</div>
      <div className="chip"><${Ico} name="calendar" size=${20} /> Agendamento pelo WhatsApp</div>
    </div>
  </header>`;
}

function Diferenciais(){
  var d = [
    ['heart','Acolhimento de verdade','Você é ouvido, entende cada etapa e decide com calma. Sem pressa e sem julgamentos.'],
    ['spark','Estética e saúde juntas','Tratamentos pensados para o seu rosto e o seu jeito de sorrir, com resultado natural.'],
    ['shield','Cuidado e segurança','Rotina de biossegurança e protocolos claros em cada procedimento.'],
    ['chat','Fácil de falar com a gente','Dúvidas, horários e remarcações direto pelo WhatsApp, sem complicação.']
  ];
  return html`<section id="diferenciais"><div className="wrap">
    <div className="sec-head"><span className="kicker" data-reveal>Por que escolher</span>
      <h2 data-split>Odontologia que cuida de você, não só dos dentes.</h2></div>
    <div className="grid4" data-stagger>
      ${d.map(function(x,i){ return html`<article className="card" key=${i} data-tilt><div className="ic"><${Ico} name=${x[0]} size=${26} /></div><h3>${x[1]}</h3><p>${x[2]}</p></article>`; })}
    </div></div></section>`;
}

function Tratamentos(){
  var s = useState(0), on = s[0], setOn = s[1];
  return html`<section className="treat" id="tratamentos"><div className="wrap">
    <div className="sec-head"><span className="kicker" data-reveal>Tratamentos</span>
      <h2 data-split>Tudo para o seu <em>sorriso</em> em um só lugar.</h2></div>
    <div className="treat-grid">
      <ul className="t-list" data-reveal="left">
        ${TRATAMENTOS.map(function(x,i){ return html`<li key=${i} className=${on===i?'on':''} onMouseEnter=${function(){setOn(i)}} onClick=${function(){setOn(i)}}>
          <h3>${x.t}<${Ico} name="arrow" size=${28} /></h3><p>${x.d}</p></li>`; })}
      </ul>
      <div style=${{position:'relative'}} data-reveal="zoom">
        <div className="spin"><svg viewBox="0 0 120 120" width="130" height="130"><defs><path id="c" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs><circle cx="60" cy="60" r="58" fill="#ff6b57"/><text fill="#fff" fontSize="11.5" fontWeight="700" letterSpacing="3"><textPath href="#c">SORRIA • SORRIA • SORRIA • SORRIA •</textPath></text></svg></div>
        <div className="t-visual">
          ${TRATAMENTOS.map(function(x,i){ return html`<${Img} key=${i} src=${x.img} alt=${x.t} className=${on===i?'on':''} />`; })}
        </div>
      </div>
    </div></div></section>`;
}

function Passos(){
  var p = [['Chame no WhatsApp','Conte o que você precisa e escolha o melhor horário.'],['Avaliação inicial','Conversa, exame e explicação clara do seu caso.'],['Plano sob medida','Você conhece as opções e decide com tranquilidade.'],['Seu novo sorriso','Tratamento conduzido com cuidado, do começo ao fim.']];
  return html`<section id="como"><div className="wrap">
    <div className="sec-head"><span className="kicker" data-reveal>Como funciona</span><h2 data-split>Do primeiro contato ao sorriso, sem complicação.</h2></div>
    <div className="steps" data-stagger>${p.map(function(x,i){ return html`<div className="step" key=${i}><h3>${x[0]}</h3><p>${x[1]}</p></div>`; })}</div>
  </div></section>`;
}

function Depoimentos(){
  var q = [['Fui com medo e saí tranquila. Explicaram tudo antes de começar e em nenhum momento me senti apressada.','Mariana S.','Paciente · Vila Velha'],['Atendimento muito atencioso e agendamento rápido pelo WhatsApp. Recomendo para a família toda.','Carlos A.','Paciente · Centro'],['Meu sorriso ficou natural, do jeito que eu queria. Equipe educada e ambiente acolhedor.','Fernanda L.','Paciente · Glória']];
  return html`<section className="proof"><div className="wrap">
    <div className="sec-head"><span className="kicker" data-reveal>Quem já cuidou do sorriso</span><h2 data-split>Histórias de confiança e bem-estar.</h2></div>
    <div className="t3" data-stagger>${q.map(function(x,i){ return html`<figure className="quote" key=${i} style=${{margin:0}}>
      <div className="stars">${[0,1,2,3,4].map(function(k){return html`<${Ico} key=${k} name="star" size=${18} />`})}</div>
      <p>“${x[0]}”</p><figcaption className="who"><i>${x[1][0]}</i><span>${x[1]}<small>${x[2]}</small></span></figcaption></figure>`; })}</div>
  </div></section>`;
}

function Final(){
  return html`<section className="final" id="contato"><${Img} className="lp-cover" src="img/odonto-1.jpg" alt="" /><div className="wrap">
    <h2 data-split>Seu próximo sorriso começa com uma <em>conversa.</em></h2>
    <p data-reveal>Chame a equipe no WhatsApp, tire suas dúvidas e agende sua avaliação.</p>
    <div data-reveal="zoom"><${WaButton} msg="Olá! Gostaria de agendar uma avaliação na Bocas e Dentes.">Agendar pelo WhatsApp<//></div>
  </div></section>`;
}

function Footer(){
  return html`<footer><div className="wrap"><div className="f-grid">
    <div><div className="logo"><i><${Ico} name="smile" size=${18} /></i>Bocas e Dentes</div><p style=${{maxWidth:'36ch',lineHeight:1.7,opacity:.75}}>Odontologia com acolhimento e cuidado no Centro de Vila Velha.</p></div>
    <div><h4>Contato</h4><ul>
      <li><${Ico} name="phone" size=${18} /> (27) 99971-4672</li>
      <li><${Ico} name="wa" size=${18} /> WhatsApp para agendamentos</li>
    </ul></div>
    <div><h4>Onde estamos</h4><ul>
      <li><${Ico} name="pin" size=${18} /> Rua Luiza Grinalda, 570 — Centro<br/>Vila Velha · ES</li>
      <li><${Ico} name="clock" size=${18} /> Horários: consulte pelo WhatsApp</li>
    </ul></div></div>
    <p className="copy">© Bocas e Dentes. Prévia de demonstração — layout e textos ilustrativos.</p></div></footer>`;
}

function Page(){
  return html`<main><${Nav} /><${Hero} />
    <div className="band"><${Marquee} items=${['Limpeza','Clareamento','Estética do sorriso','Implantes','Ortodontia','Urgência']} speed=${28} /></div>
    <${Diferenciais} /><${Tratamentos} /><${Passos} /><${Depoimentos} /><${Final} /><${Footer} /></main>`;
}

LP.mount(Page, { empresa:'Bocas e Dentes', whatsapp:'5527999714672', mensagem:'Olá! Vi a prévia do site da Bocas e Dentes e gostaria de agendar uma avaliação.', intro:{ title:'Bocas e Dentes', sub:'Odontologia · Vila Velha' } });
})();
</script>
</body>
</html>
